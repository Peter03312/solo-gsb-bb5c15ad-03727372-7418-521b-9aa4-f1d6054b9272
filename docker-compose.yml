services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recycle}
      POSTGRES_USER: ${POSTGRES_USER:-recycle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recycle}
    ports:
      - "${POSTGRES_PORT_PUBLISH:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recycle} -d ${POSTGRES_DB:-recycle}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-recycle}
      POSTGRES_USER: ${POSTGRES_USER:-recycle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recycle}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "${APP_PORT_PUBLISH:-8000}:8000"

volumes:
  pgdata:
